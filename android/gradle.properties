# Tuned for a low-RAM machine (~8 GB). Keep the JVM footprint small so AGP's
# native allocations (aapt2, dexing) don't exhaust physical memory.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
# Run the Kotlin compiler inside the Gradle JVM — one process, not several —
# so a low-RAM machine doesn't have to start a separate Kotlin daemon.
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
